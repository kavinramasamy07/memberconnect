<div class="row">
  <div class="col-2">&nbsp;</div>
  <div class="col-8 top-pad-100">
    <p-card header="Member Login">
      <ng-template pTemplate="header">
        <img alt="Card" width="50%" style="padding: 30px;" height="75%"
          src="https://cdn.prod.website-files.com/61dfe01d7c07e8e67a2a7a9a/61dfe01d7c07e887742a7aa7_Group%2051.svg" />
      </ng-template>

      <p class="mb-4">Sign in with your Junior Economic Club account to continue.</p>

      <div class="d-flex row">
        <div class="col-12 align-right">
          <button type="button" class="btn btn-primary btn-login p-button-rounded p-component"
            (click)="onLogin()">Sign In</button>
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="flex gap-3 mt-1"></div>
      </ng-template>
    </p-card>
  </div>
</div>
